name: AgroNexus CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and test backend
        working-directory: backend
        run: mvn --batch-mode verify

  docker:
    name: Backend container build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file deployment/Dockerfile.backend --tag agronexus-backend:ci .

      - name: Verify Documentation & SQL Scripts
        run: |
          echo "Verifying deployment artifacts..."
          test -f deployment/DEPLOYMENT_GUIDE.md
          test -f deployment/supabase_setup.sql
          test -f deployment/Dockerfile.backend
          test -f deployment/render.yaml
          echo "Deployment artifacts verified successfully!"
