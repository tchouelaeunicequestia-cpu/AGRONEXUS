version: '3.8'

services:
  # 1. PostGIS + pgvector Database Service
  db:
    image: pgvector/pgvector:pg16
    container_name: agronexus_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agronexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase_setup.sql:/docker-entrypoint-initdb.d/01_init.sql

  # 2. MQTT Broker Service for ESP32 Hardware Nodes
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: agronexus_mqtt_broker
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"

  # 3. Spring Boot Backend API Service
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: agronexus_backend_service
    restart: always
    depends_on:
      - db
      - mqtt
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-agronexus_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    ports:
      - "8081:8080"

volumes:
  postgres_data:
